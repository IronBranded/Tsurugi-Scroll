<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Tsurugi Scroll — DFIR · Malware · Threat Hunting</title>
<!-- OG / Social -->
<meta property="og:title" content="Tsurugi Scroll — DFIR Tool Reference">
<meta property="og:description" content="1,096 tools from Tsurugi Linux LAB 26.03 — interactive, searchable, filterable DFIR reference map.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#0e0c0b">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23c0392b'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e07b39' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo-dot"></div>
  <span class="logo-text">Tsurugi Scroll</span>
  <span class="logo-sub" style="display:none" id="logo-sub-text">DFIR · Malware · Threat Hunting</span>
  <!-- Global persistent search -->
  <div id="topbar-search-wrap">
    <span class="icon">⌕</span>
    <input id="topbar-search" placeholder="Search all 1,096 tools… (press /)" autocomplete="off" spellcheck="false">
    <span id="ts-results-badge"></span>
    <button id="ts-clear" title="Clear search">✕</button>
  </div>
  <div class="topbar-right">
    <span class="stat-pill" id="stat-display"><b id="stat-tools" style="color:var(--accent)">—</b>&nbsp;tools</span>
    <div class="topbar-sep"></div>
    <span id="version-badge">LAB · 26.03</span>
    <div class="topbar-sep"></div>
    <button class="tb-btn" id="bm-toggle" title="Bookmarks &amp; Recent (B)">
      ★<span class="bm-badge" id="bm-count" style="display:none">0</span>
    </button>
    <button class="tb-btn" id="theme-toggle" title="Toggle light/dark mode (T)">🌙</button>
    <button class="tb-btn" id="kbd-help-btn" title="Keyboard shortcuts (?)">⌨</button>
  </div>
</div>

<!-- GLOBAL SEARCH OVERLAY -->
<div id="gs-overlay"></div>
<div id="gs-dropdown" role="listbox" aria-label="Search results"></div>

<!-- TAB BAR -->
<div id="tabbar"></div>

<!-- MAIN CONTENT -->
<div id="content"></div>

<!-- BOOKMARKS / RECENTS PANEL -->
<div id="bm-panel">
  <div id="bm-panel-head">
    <span style="font-family:'Cinzel',serif;font-weight:700;font-size:12px;color:var(--accent3);letter-spacing:1px;text-transform:uppercase">Saved Tools</span>
    <div style="display:flex;gap:6px">
      <button id="bm-clear-all" style="font-size:9px;padding:3px 8px;color:var(--text4);border:1px solid var(--border);border-radius:2px;background:none;letter-spacing:.5px;text-transform:uppercase;font-family:'Inter',sans-serif">Clear</button>
      <button id="bm-close" style="color:var(--text4);font-size:18px;line-height:1">✕</button>
    </div>
  </div>
  <div id="bm-tabs">
    <button class="bm-tab active" data-bm-tab="bookmarks">★ Bookmarks</button>
    <button class="bm-tab" data-bm-tab="recent">⏱ Recently Viewed</button>
  </div>
  <div id="bm-panel-body"></div>
</div>

<!-- MODAL -->
<div id="overlay">
  <div id="modal"></div>
</div>

<!-- KBD HELP MODAL -->
<div id="kbd-overlay" style="display:none;position:fixed;inset:0;background:rgba(8,6,5,.93);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:16px">
  <div style="background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--accent);border-radius:2px;width:100%;max-width:480px;padding:28px;animation:fadeUp .18s ease;box-shadow:0 24px 80px rgba(0,0,0,.7)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h3 style="font-size:13px;font-weight:700;color:var(--text1);font-family:'Cinzel',serif;letter-spacing:2px;text-transform:uppercase">Keyboard Shortcuts</h3>
      <button id="kbd-close" style="color:var(--text4);font-size:18px;line-height:1">✕</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--text3)">
      <div><span class="kbd">/</span> &nbsp;Focus search</div>
      <div><span class="kbd">Esc</span> &nbsp;Close / clear</div>
      <div><span class="kbd">↑</span><span class="kbd">↓</span> &nbsp;Navigate cards</div>
      <div><span class="kbd">Enter</span> &nbsp;Open tool</div>
      <div><span class="kbd">←</span><span class="kbd">→</span> &nbsp;Modal prev/next</div>
      <div><span class="kbd">S</span> &nbsp;Star / bookmark</div>
      <div><span class="kbd">B</span> &nbsp;Bookmarks panel</div>
      <div><span class="kbd">T</span> &nbsp;Toggle theme</div>
      <div><span class="kbd">?</span> &nbsp;This help</div>
      <div><span class="kbd">C</span> &nbsp;Copy command</div>
    </div>
  </div>
</div>

<script src="data/manifest.js"></script>
<script src="data/counts.js"></script>
<script src="data/runbooks.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
